name: windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  windows-build:
    runs-on: ${{ matrix.windows-version }}
    strategy:
      fail-fast: false
      matrix:
        windows-version:
          - 'windows-latest'
    env:
      CXXFLAGS: /MP

    steps:
      - name: Sync repository
        uses: actions/checkout@v6

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt_installation/'
          cache: 'true'
          tools: 'tools_ifw'
          add-tools-to-path: 'true'

      - name: Conan install
        shell: pwsh
        run: |
          conan install . -of build --build=missing -pr:b=default -s build_type=Release -s compiler.cppstd=17

      - name: Build Plotjuggler
        shell: pwsh
        run: |
          cmake --preset conan-default -S . -B build -DCMAKE_BUILD_TYPE=Release -DPJ_INSTALLATION="windows" -DPJ_PLUGINS_DIRECTORY="bin" -DBUILD_TESTING=OFF -DPJ_ENABLE_VECTOR_BLF=ON -DPJ_ENABLE_DBCPPP=ON 2>&1 | Tee-Object -FilePath build\configure.log
          if ($LASTEXITCODE -ne 0) {
              $tail = Get-Content build\configure.log -Tail 120
              $message = ($tail -join "`n")
              $message = $message -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error title=CMake configure failed::$message"
              exit $LASTEXITCODE
          }
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build\build.log
          if ($LASTEXITCODE -ne 0) {
              $error_lines = Select-String -Path build\build.log `
                  -Pattern 'error C[0-9]+|fatal error|LNK[0-9]+|CMake Error|FAILED:|MSB[0-9]+:' `
                  -CaseSensitive:$false | Select-Object -Last 120
              if ($error_lines) {
                  $tail = $error_lines | ForEach-Object { $_.Line }
              } else {
                  $tail = Get-Content build\build.log -Tail 120
              }
              $message = ($tail -join "`n")
              $message = $message -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error title=Build Plotjuggler failed::$message"
              exit $LASTEXITCODE
          }

      - name: Prepare installer directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\io.plotjuggler.application\data
          Copy-Item -Path build\bin\Release\*.* -Destination installer\io.plotjuggler.application\data -Recurse -Force

          $dataDir = (Resolve-Path "installer\io.plotjuggler.application\data").Path
          $extraDlls = Get-ChildItem -Path build -Recurse -File -Filter "*.dll" |
            Where-Object { $_.Name -match '(?i)(dbcppp|vector_blf|libxml2|libxmlmm|zlib|zstd|lz4)' } |
            Sort-Object -Property FullName -Unique

          foreach ($dll in $extraDlls) {
            Copy-Item -Path $dll.FullName -Destination $dataDir -Force
            Write-Host "Copied runtime dependency: $($dll.Name)"
          }

          $blfPlugin = Get-ChildItem -Path $dataDir -File -Filter "*.dll" |
            Where-Object { $_.Name -match '(?i)dataloadblf' } |
            Select-Object -First 1
          if (-not $blfPlugin) {
            throw "DataLoadBLF plugin DLL was not found in installer payload directory."
          }

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            $deps = & $dumpbin.Source /DEPENDENTS $blfPlugin.FullName 2>&1
            $requiresDbcppp = [bool]($deps | Select-String -Pattern '(?i)dbcppp')
            $requiresVectorBlf = [bool]($deps | Select-String -Pattern '(?i)vector_blf')

            if ($requiresDbcppp -and -not (Get-ChildItem -Path $dataDir -File -Filter "*dbcppp*.dll" -ErrorAction SilentlyContinue)) {
              throw "DataLoadBLF depends on dbcppp, but no dbcppp DLL is present in installer payload."
            }
            if ($requiresVectorBlf -and -not (Get-ChildItem -Path $dataDir -File -Filter "*Vector_BLF*.dll" -ErrorAction SilentlyContinue)) {
              throw "DataLoadBLF depends on Vector_BLF, but no Vector_BLF DLL is present in installer payload."
            }
          } else {
            Write-Warning "dumpbin.exe was not found; dependency presence check for DataLoadBLF was skipped."
          }

          cmd /c installer\windeploy_pj.bat

      - name: Create installer using QT Installation Framework
        shell: pwsh
        run: |
          # Sanitize ref_name to replace / with - for valid Windows filename
          $ref_name = "${{ github.ref_name }}" -replace '/', '-'
          $installer_name = "PlotJuggler-$ref_name-Windows-x64.exe"
          "INSTALLER_NAME=$installer_name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Find binarycreator executable
          $binarycreator = Get-ChildItem -Path "${{ github.workspace }}\qt_installation" -Recurse -Name "binarycreator.exe" | Select-Object -First 1
          if (-not $binarycreator) {
              Write-Error "binarycreator.exe not found in Qt installation"
              exit 1
          }
          $binarycreator_path = Join-Path "${{ github.workspace }}\qt_installation" $binarycreator

          # Create installer using existing configuration files
          Write-Host "Creating installer: $installer_name"
          & "$binarycreator_path" --offline-only -c installer\config.xml -p installer $installer_name

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create installer"
              exit 1
          }

          Write-Host "Installer created successfully: $installer_name"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.INSTALLER_NAME }}
          path: ${{ env.INSTALLER_NAME }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER_NAME }}
          generate_release_notes: false
          fail_on_unmatched_files: false
